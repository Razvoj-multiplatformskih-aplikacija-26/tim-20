name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Keep the shared packages free of Flutter and platform libraries
        run: |
          if grep -rE "package:flutter|dart:io|dart:ffi|dart:js_interop" packages/domain packages/use_cases packages/blocs; then
            echo "::error::a shared package imports Flutter or a platform library"
            exit 1
          fi

      - name: Test the shared packages on the VM and in Chrome
        run: |
          for package in packages/*/; do
            echo "::group::${package}"
            if grep -q "sdk: flutter" "${package}pubspec.yaml"; then
              (cd "${package}" && flutter test)
            else
              (cd "${package}" && dart test -p vm,chrome)
            fi
            echo "::endgroup::"
          done

      - name: Test the apps
        run: |
          for app in apps/*/; do
            echo "::group::${app}"
            (cd "${app}" && flutter test)
            echo "::endgroup::"
          done
